<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <!--for mobile phones-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up - MMU LostLink</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="/static/style.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    </head>
    <body>

        <div class="signup container d-flex flex-column align-items-center my-5 p-5 border rounded-4 shadow-sm">

            <div class="h1 text-center mt-4">MMU LostLink</div>

            <div class=" fw-light h1 text-center mt-5 mb-4">Welcome</div>
            
            <form action="/signup" method="POST">
            
                    <div class= "form-floating">
                        <input type="text" class="shadow-sm form-control" id="username" name="Username" placeholder="">
                        <label for="username">Enter Username</label>
                    </div>

                    <div class= "form-floating mt-3">
                        <input type="email" class="shadow-sm form-control" id="email" name="Email" placeholder="">
                        <label for="email">Enter Email</label>
                    </div>

                    <div class= "form-floating mt-3">
                        <input type="password" class="shadow-sm form-control" id="password" name="Password" placeholder="">
                        <label for="password">Create password</label>
                        <button type="button" id="toggle_password" class="btn btn-lg position-absolute h-100 end-0 top-0 d-flex align-items-center">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>

                    <div class= "form-floating mt-3">
                        <input type="password" class="shadow-sm form-control" id="cpassword" name="cPassword" placeholder="">
                        <label for="cpassword">Confirm password</label>
                    </div>
                
                <!-- href link is empty!!! -->
                <div class="d-flex justify-content-center mt-4">
                    <a href="">Already have an account?</a>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary shadow-sm mt-4">Sign Up</button>
                </div>

            </form>
        </div>

        <script>
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('toggle_password');
            const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');

            toggleBtn.addEventListener('click', () => {
                const isHidden = passwordInput.type === 'password';
                passwordInput.type = isHidden ? 'text' : 'password';
                toggleIcon.textContent = isHidden ? 'visibility_off' : 'visibility';
            });
        </script>
    </body>
</html>
